[package]
name = "b1air-passkey"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-only"
publish = false
description = "The phone as a security key: a FIDO HID authenticator that hands each request to the phone over caBLE"

[[bin]]
name = "b1air-passkey"
path = "src/main.rs"

[dependencies]
libwebauthn = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
tokio-seqpacket = "0.8"
qrcode = { version = "0.14", default-features = false }
ciborium = "0.2"
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[profile.release]
lto = "thin"
strip = true
