# b1air: Windows programs and games (src/scripts/b1air-windows).
# As many memory maps as a process wants: some games (and Proton's DXVK with
# them) need far more than the kernel's 65530 and crash when they run out.
# SteamOS's value; Fedora and Ubuntu raised theirs the same way.
vm.max_map_count = 2147483642
