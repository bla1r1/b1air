; Feral GameMode (gamemoded), as b1air sets it up.
;
; A game asks for GameMode — Steam with `gamemoderun %command%` in a game's
; launch options, Heroic and Lutris with their GameMode switch — and gamemoded
; switches the CPU governor and the rest of what it does. These hooks turn
; b1air's own Game Mode on with it: desktop effects off, the performance power
; profile, Do Not Disturb (Settings → Game Mode).

[general]
; Games get a little more of the CPU than the desktop around them.
renice=5

[custom]
start=b1air-gamemode-hook start
end=b1air-gamemode-hook end
