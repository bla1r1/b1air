# Starship Prompt Configuration (Tokyo Night Theme)
# https://starship.rs

# Explicit two-line prompt: info line, then the input arrow alone on a fresh
# line via $line_break. This was the original design (the very first
# version of this file had it); it got dropped at some point, which is
# exactly what made the prompt unreliable — with $character sitting right
# after a $fill block that pads to the exact terminal width, the cursor
# could land on the last column, and the next keystroke would wrap to a
# second line depending on font/terminal. $line_break sidesteps that
# entirely: $character always starts a fresh line, so it can never collide
# with the edge.
format = """
$os\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$python\
$docker_context\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

# The connector across to the right-hand side.
#
# A space here meant the right half was joined to the left by nothing, and on a
# wide terminal the time floated alone with a hand's width of gap. The old
# prompt drew a dotted rule across it in the dim frame colour, which is what
# made two halves read as one line.
[fill]
symbol = "·"
style = "#3b4261"

# OS Icon
[os]
disabled = false
style = "bold #7aa2f7"

[os.symbols]
Arch = "󰣇 "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Fedora = "󰣛 "
Linux = "󰌽 "
Macos = "󰀵 "

# Directory
# The whole path, and a folder to hang it on.
#
# Truncating to three segments turned ~/Documents/GitHub/DotsFiles into
# "…/DotsFiles" — the ellipsis says a path was cut without saying what from,
# and the tilde that tells you it is under home went with it. The old prompt
# showed the path.
[directory]
style = "bold #7dcfff"
format = "[$path]($style) "
truncate_to_repo = false
truncation_length = 0
home_symbol = "~"

# Git
[git_branch]
symbol = " "
style = "bold #bb9af7"
# No "on" in front of the branch. The old prompt put the branch straight after
# the path, and the word was three characters of grammar in a line that is
# otherwise all symbols.
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #f7768e"
format = "([$all_status$ahead_behind]($style) )"
# With their counts. Collapsed to bare glyphs these said only *that* something
# was modified or untracked, never how much — "[!?↓]" against the old prompt's
# "↓12 !43 ?1", which is the difference between knowing there is work in the
# tree and knowing how much of it there is.
conflicted = "󰞇 ${count} "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕↑${ahead_count}↓${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "󰁔 "
deleted = " "

# Programming Languages
[nodejs]
symbol = "󰏤 "
style = "bold #9ece6a"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold #ff9e64"
format = "via [$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold #7dcfff"
format = "via [$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold #e0af68"
format = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold #7aa2f7"
format = "via [$symbol$context]($style) "

# Command Duration
[cmd_duration]
min_time = 2_000
style = "bold #e0af68"
format = "  took [$duration]($style)"

# Time
# 12-hour with seconds, which is what the old prompt showed, and no "at" in
# front of it: the dotted rule already says the line has a right-hand side.
[time]
disabled = false
time_format = "%I:%M:%S %p"
style = "#565f89"
format = "  [$time]($style)"

# Prompt Characters
[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #9ece6a)"
