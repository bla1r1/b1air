# ~/.local/bin on PATH for every session, not only sway's.
#
# `make install` puts the b1air suite there, and the sway session exports it,
# but a KDE, GNOME or any other session never read that: from their menus the
# apps did not start, and inside them every `b1air-daemon …` the apps run was
# "command not found". systemd's user manager reads this directory, and Plasma
# and GNOME start their sessions through it.
PATH=$HOME/.local/bin:${PATH}
