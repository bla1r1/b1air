##############################
### WINDOWS AND WORKSPACES ###
##############################
# Docs: https://man.archlinux.org/man/sway.5  (for_window / assign)
#
# NOTE:
# - Plain Sway ignores swayFX-only commands such as opacity/blur/dim_inactive.
# - swayFX does not support Hyprland-style separate active/inactive opacity values,
#   so this config uses:
#   1) a light global transparency baseline,
#   2) stronger inactive dimming,
#   3) per-app opaque overrides for apps that look better fully solid.

# ── swayFX OPACITY / BLUR ────────────────────────────────────────

# Transparency is opt-IN, not global.
#
# `opacity 0.94` on every window meant the compositor could not treat any window
# as opaque, so it had to blend — and blur what was behind — for all of them,
# including fullscreen ones with nothing visible behind at all. That is a lot of
# work for 6% of translucency most windows never showed off.
#
# The apps where glass actually reads: terminal, launcher, file manager over a
# wallpaper. Everything else is opaque and costs nothing.
for_window [app_id="b1air-term"] opacity 0.92

# The long list below is now mostly redundant — windows are opaque by default —
# but it is kept because it also disables blur per app, which still matters.
for_window [app_id="firefox"] opacity 1.0, blur disable
for_window [class="^(firefox)$"] opacity 1.0, blur disable

for_window [app_id="org.gnome.Nautilus"] opacity 1.0, blur disable
for_window [class="^(org\\.gnome\\.Nautilus)$"] opacity 1.0, blur disable

for_window [app_id="^(code|code-url-handler|codium)$"] opacity 1.0, blur disable
for_window [class="^(Code|code-url-handler|VSCodium|codium)$"] opacity 1.0, blur disable

for_window [class="^(libreoffice-writer)$"] opacity 1.0
for_window [app_id="gimp"] opacity 1.0
for_window [class="^(Gimp-2\\.10)$"] opacity 1.0
for_window [app_id="satty"] floating disable, opacity 1.0
for_window [app_id="com.obsproject.Studio"] opacity 1.0, blur disable
for_window [class="^(com\\.obsproject\\.Studio)$"] opacity 1.0, blur disable
for_window [app_id="org.inkscape.Inkscape"] opacity 1.0
for_window [class="^(org\\.inkscape\\.Inkscape)$"] opacity 1.0
for_window [app_id="darktable"] opacity 1.0
for_window [class="^(Darktable)$"] opacity 1.0
for_window [app_id="org.kde.dolphin"] opacity 1.0, blur disable
for_window [class="^(org\\.kde\\.dolphin)$"] opacity 1.0, blur disable
for_window [app_id="org.kde.okular"] opacity 1.0
for_window [class="^(org\\.kde\\.okular)$"] opacity 1.0
for_window [app_id="org.kde.skanpage"] opacity 1.0
for_window [class="^(org\\.kde\\.skanpage)$"] opacity 1.0
for_window [app_id="org.pwmt.zathura"] opacity 1.0
for_window [class="^(org\\.pwmt\\.zathura)$"] opacity 1.0
for_window [app_id="org.kde.kdeconnect.app"] opacity 1.0
for_window [class="^(org\\.kde\\.kdeconnect\\.app)$"] opacity 1.0
for_window [class="^(i3lock)$"] opacity 1.0, blur disable
for_window [app_id="flameshot"] opacity 1.0
for_window [class="^(flameshot|org\\.flameshot\\.Flameshot)$"] opacity 1.0
for_window [app_id="mpv"] opacity 1.0, blur disable
for_window [class="^(mpv)$"] opacity 1.0, blur disable
for_window [app_id="^(vlc|org\\.videolan\\.VLC)$"] opacity 1.0, blur disable
for_window [class="^(vlc)$"] opacity 1.0, blur disable
for_window [app_id="obsidian"] opacity 1.0
for_window [class="^(obsidian)$"] opacity 1.0
for_window [app_id="net.cozic.joplin_desktop"] opacity 1.0
for_window [class="^(Joplin)$"] opacity 1.0
for_window [app_id="com.logseq.Logseq"] opacity 1.0
for_window [class="^(Logseq)$"] opacity 1.0
for_window [app_id="org.kde.ghostwriter"] opacity 1.0
for_window [class="^(org\\.kde\\.ghostwriter)$"] opacity 1.0
for_window [class="^(Google Earth Pro)$"] opacity 1.0
for_window [app_id="virt-manager"] opacity 1.0, blur disable
for_window [class="^(virt-manager)$"] opacity 1.0, blur disable
for_window [app_id="remote-viewer"] opacity 1.0, blur disable
for_window [class="^(remote-viewer)$"] opacity 1.0, blur disable
for_window [app_id="qemu"] opacity 1.0, blur disable
for_window [class="^(QEMU)$"] opacity 1.0, blur disable

# ── FLOATING ─────────────────────────────────────────────────────

# Regular applications are tiled by default. The shell is the only component
# that owns floating surfaces; application windows must not be forced into it.
for_window [app_id="firefox" title="Picture-in-Picture"] floating disable
for_window [app_id="pavucontrol"]           floating disable
for_window [app_id="blueman-manager"]       floating disable
for_window [app_id="nm-applet"]             floating disable
for_window [app_id="nmtui"]                 floating disable
for_window [app_id="nm-connection-editor"]  floating disable
for_window [app_id="qt5ct"]      floating disable
for_window [app_id="qt6ct"]      floating disable
# Our apps get sway's border like every other window. They used to draw a
# fixed outline of their own and have `border none` here, which made them the
# only windows whose frame did not show focus; the apps no longer draw one.
for_window [app_id="org.quickshell"] floating enable

# Inhibit idle in fullscreen (Wayland & Xwayland games, video)
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"] inhibit_idle fullscreen

# Gaming / Steam / Wine / Gamescope rules
for_window [class="^steam_app_.*"] floating disable, inhibit_idle focus
for_window [class="^gamescope$"] fullscreen enable, inhibit_idle focus
for_window [class="^Wine$|^heroic$|^lutris$"] inhibit_idle focus

# Virt-manager / QEMU
# NOTE: verify real app_id via: swaymsg -t get_tree | jq '.. | .app_id? // empty'
for_window [app_id="virt-manager"]   floating disable
for_window [app_id="remote-viewer"]  floating disable
for_window [app_id="qemu"]           floating disable   # was "QEMU" — Wayland app_ids are lowercase

# ── WORKSPACE ASSIGNMENTS ────────────────────────────────────────

assign [app_id="obsidian"]               workspace 4
assign [app_id="spotify"]                workspace 5
assign [app_id="darktable"]              workspace 6   # was "Darktable" — likely lowercase on Wayland
assign [app_id="org.inkscape.Inkscape"]  workspace 7
assign [app_id="gimp"]                   workspace 7   # was "Gimp-2.10" — check with get_tree

# ── swayFX: blur on layers (ignored by plain sway) ───────────────
# Layer namespaces, verified against WlrLayershell.namespace in the shell:
# b1air-topbar, qs-master, qs-notifications, qs-osd, qs-polkit,
# qs-screenshot-overlay. The rules below used to name "notifications",
# "b1air-shell" and "quickshell" — none of which any surface declares — so the
# notification toasts never got the blur and rounded corners this line intends,
# and the top bar, OSD, polkit dialog and screenshot overlay were left on the
# compositor defaults while qs-master alone had effects turned off.
layer_effects "qs-notifications" blur enable; blur_ignore_transparent enable; shadows enable; corner_radius 10
layer_effects "qs-master" blur disable; shadows disable
layer_effects "b1air-topbar" blur disable; shadows disable
layer_effects "qs-osd" blur disable; shadows disable
layer_effects "qs-polkit" blur disable; shadows disable
layer_effects "qs-screenshot-overlay" blur disable; shadows disable


# Telegram 
assign [app_id="org.telegram.desktop"] workspace 3
for_window [app_id="virt-manager" title="^(?!Virtual Machine Manager).*"] floating disable

# ── Native b1air Desktop Suite ───────────────────────────────────────────────
# Normal applications follow Sway's regular tiling/layout rules. Only shell
# surfaces (Quickshell popups/layers above) are floating by design.
for_window [app_id="^b1air-(files|git|monitor|notes|settings|term|text|view)$"] floating disable
