#############
### INPUT ###
#############
# Docs: https://man.archlinux.org/man/sway-input.5

input type:keyboard {
    xkb_layout "us,ua"
    xkb_options "grp:alt_shift_toggle"
    repeat_delay 240
    repeat_rate 35
}

input type:pointer {
    accel_profile "flat"
    pointer_accel 0
}

# The compositor draws its own pointer and does not read GTK's settings.ini,
# so without this the cursor under Sway stayed the default while GTK apps used
# the theme below. Matches .config/gtk-3.0/settings.ini.
seat * xcursor_theme b1air-cursors 24

input type:touchpad {
    natural_scroll disabled
    tap enabled
    # Two fingers pressed together = right click. libinput's default on a
    # clickpad is the bottom-right corner, which turned a two-finger press into
    # a left click. Settings -> Mouse & Touchpad can switch it back.
    click_method clickfinger
}

# Three-finger workspace swipe.
#
# Settings -> Mouse & Touchpad has offered a toggle for this since the page was
# written, and it only ever wrote a value into settings.json: no binding was
# created here or anywhere else, so the gesture did nothing. The default lives
# here; the toggle writes conf.d/custom_input.conf, which is included after
# this file and wins.
bindgesture swipe:3:left workspace prev
bindgesture swipe:3:right workspace next
