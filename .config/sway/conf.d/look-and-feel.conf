#####################
### LOOK AND FEEL ###
#####################
# Breeze Dark, the default theme. Settings → Themes rewrites these for the
# theme chosen (b1air-daemon appearance apply); these are for before that.

# ── Colors (for use in client.* below) ───────────────────────────
# ground     = #202326
# lowest     = #141618
# text       = #fcfcfc
# textDim    = #b4bbc2
# primary    = #3daee9
# tertiary   = #b07ad9
# red        = #ed4b5b
# border_off = #31363b

# ── Gaps (sway native) ────────────────────────────────────────────
# 20 was a lot: with the 5 inner gap it put 25 pixels between a window and
# every screen edge, and the band it left under the top bar was wider than the
# bar's own islands are tall. 10 keeps the floating look without the frame.
gaps inner 5
gaps outer 10
# No gap above the first window. The bar draws its own translucent strip, so
# it is already visible as a bar; an outer gap on that edge only opens a band
# of bare desktop between the two, which on a plain background reads as one
# black stripe rather than as breathing room. The other three edges keep it.
gaps top 0

# ── Borders ───────────────────────────────────────────────────────
# One pixel: focus is shown by the shadow and the dimming of the others, as on
# other desktops, not by a coloured frame.
default_border          pixel 1
default_floating_border pixel 1

# client.<state> <border> <background> <text> <indicator> <child_border>
client.focused          #3daee9 #202326 #fcfcfc #b07ad9 #3daee9
client.focused_inactive #31363b #1b1e20 #b4bbc2 #31363b #31363b
client.unfocused        #31363b #1b1e20 #b4bbc2 #31363b #31363b
client.urgent           #ed4b5b #202326 #fcfcfc #ed4b5b #ed4b5b

# ── swayFX extras (ignored by plain sway) ────────────────────────
smart_corner_radius enable
corner_radius 10
blur enable
blur_xray disable

# Blur cost is roughly linear in passes and quadratic-ish in radius. It only
# runs where something translucent is drawn and changed — the shell's panels,
# the apps' sidebars — not over the whole screen. Three passes at radius 3 is
# twice the spread of two (kawase doubles it per pass), which is what it takes
# for a panel to read as frosted glass rather than smeared; two at 3 left the
# wallpaper recognisable through it.
blur_passes 3
blur_radius 3
# Vibrancy: what shows through is more saturated and a little darker than the
# picture itself, so the glass has colour and its text keeps contrast. The
# grain breaks up banding in the blur of a smooth sky.
blur_saturation 1.35
blur_brightness 0.95
blur_contrast 0.95
blur_noise 0.02
shadows enable
# Deeper and lower, as a light from above throws it: a window lifts off what is
# behind it instead of glowing at its edges.
shadow_blur_radius 22
shadow_offset 0 6
shadow_color #00000070
# 0.30 was strong enough that unfocused windows read as disabled rather than
# merely inactive.
default_dim_inactive 0.20
dim_inactive_colors.unfocused #202326cc
dim_inactive_colors.urgent #4c0f131a
titlebar_separator disable

# ── Smart gaps / borders ──────────────────────────────────────────
smart_gaps off
smart_borders no_gaps

# ── Font ──────────────────────────────────────────────────────────
font pango:Inter SemiBold 10

# ── Tiling layout ────────────────────────────────────────────────
workspace_layout default

# ── Background ───────────────────────────────────────────────────
# b1air-bg draws it (the session daemon starts it): a picture per screen or
# per workspace, crossfaded, each held at screen size rather than at the
# size of the file. "-" stops sway starting swaybg under it.
swaybg_command -
