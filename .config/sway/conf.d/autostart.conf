#################
### AUTOSTART ###
#################

# Single native C++20 Desktop Session Manager, Autotiling, Shell & Integrated TopBar
# $b1airBin comes from variables.conf, which sway includes first. This line and
# the 38 others used to spell out ~/.local/bin directly while install.sh also
# copied the daemon to /usr/local/bin best-effort — so on a machine where the
# copy went one way and the config pointed the other, this line, the one that
# starts the whole session core, named a file that was not there. One variable
# now, rewritten by the installer to wherever it actually installed.
exec $b1airBin/b1air-daemon session

# SPICE clipboard/resolution sync — Sway doesn't run XDG autostart entries
# like GNOME/KDE do, so this must be launched explicitly. No-op on bare metal
# or non-SPICE VMs (virtio channel just won't exist).
exec [ -e /dev/virtio-ports/com.redhat.spice.0 ] && spice-vdagent
