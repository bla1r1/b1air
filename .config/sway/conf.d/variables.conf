#################
### VARIABLES ###
#################

# Where the suite's binaries are.
#
# The daemon used to be spelled out as a path under this user's home in 39
# places across this directory, which was wrong twice over: it names one
# account in a desktop that can be installed for everyone, and a bare
# `b1air-shell` was already used for 33 other binds in the same file — so the
# config disagreed with itself about how to find its own programs.
# install.sh rewrites this one line to the directory it installed into.
set $b1airBin $HOME/.local/bin

# Whatever Settings -> Default Apps picked, falling back to our own apps.
# These named b1air-term and b1air-files directly, so choosing another
# terminal there changed what links opened in and not what Mod+T opened.
set $terminal    $b1airBin/b1air-daemon open-default terminal
set $fileManager $b1airBin/b1air-daemon open-default files
set $browser     $b1airBin/b1air-daemon open-default browser
set $spotlight   b1air-shell toggle spotlight
set $launchpad   b1air-shell toggle launchpad
set $menu        b1air-shell toggle launchpad

# Xwayland support for legacy X11 apps (AnyDesk, Steam, Discord screenshare)
xwayland enable

# Suppress swaynag warning banner when running vanilla sway without swayfx extensions
swaynag_command ""
