#################
### VARIABLES ###
#################

# Whatever Settings -> Default Apps picked, falling back to our own apps.
# These named b1air-term and b1air-files directly, so choosing another
# terminal there changed what links opened in and not what Mod+T opened.
set $terminal    $HOME/.local/bin/b1air-daemon open-default terminal
set $fileManager $HOME/.local/bin/b1air-daemon open-default files
set $browser     $HOME/.local/bin/b1air-daemon open-default browser
set $spotlight   b1air-shell toggle spotlight
set $launchpad   b1air-shell toggle launchpad
set $menu        b1air-shell toggle launchpad

# Xwayland support for legacy X11 apps (AnyDesk, Steam, Discord screenshare)
xwayland enable

# Suppress swaynag warning banner when running vanilla sway without swayfx extensions
swaynag_command ""
