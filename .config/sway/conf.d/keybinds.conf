###################
### KEYBINDINGS ###
###################

set $mod Mod4
set $lock $b1airBin/b1air-daemon lock

# ── Core ──────────────────────────────────────────────────────────
bindsym --to-code $mod+t         exec $terminal
bindsym --to-code $mod+q         kill
bindsym --to-code $mod+e         exec $fileManager
bindsym --to-code $mod+space     exec $menu
bindsym --to-code $mod+k         exec $spotlight
bindsym --to-code $mod+slash     exec $spotlight
bindsym --to-code $mod+shift+space exec $spotlight
bindsym --to-code $mod+f         exec $browser
bindsym --to-code $mod+g         exec b1air-git
# Drop-down terminal: show/hide the one that exists, start it the first time.
bindsym --to-code $mod+grave     exec swaymsg '[app_id="b1air-dropdown"] scratchpad show' || b1air-term --dropdown
# Mod+V is Hyprland's float toggle again (below); the clipboard moved up a row.
bindsym --to-code $mod+ctrl+v    exec b1air-shell toggle clipboard
bindsym --to-code $mod+period    exec b1air-shell toggle emoji
bindsym --to-code $mod+shift+c   exec $b1airBin/b1air-daemon color-picker
# Mod+S is the scratchpad, as under Hyprland; Steam took the free Mod+Ctrl+S.
bindsym --to-code $mod+ctrl+s    exec steam
bindsym --to-code $mod+d         exec discord
bindsym --to-code $mod+w         exec b1air-shell open settings wallpaper
bindsym --to-code $mod+z         exec b1air-shell toggle zones
bindsym --to-code $mod+p         exec $b1airBin/b1air-daemon pip
bindsym --to-code $mod+shift+d   exec b1air-shell toggle shelf
bindsym --to-code $mod+shift+o   exec $b1airBin/b1air-daemon ocr
bindsym --to-code $mod+shift+q   exec $b1airBin/b1air-daemon qr-scan
bindsym --to-code $mod+shift+a   exec $b1airBin/b1air-daemon audio-switch
bindsym --to-code $mod+Mod1+r    exec $b1airBin/b1air-daemon record-gif
bindsym --to-code $mod+shift+v   exec $b1airBin/b1air-daemon voice-memo
bindsym --to-code $mod+Escape    exec $b1airBin/b1air-daemon force-quit

# ── Alt+Tab ───────────────────────────────────────────────────────
# Straight to the next window, as it was before the on-screen switcher (and
# as cyclenext was under Hyprland). The switcher is gone: it needed a binding
# on the release of Alt, which ran a process every time Alt was let go —
# including after every Alt+Shift layout switch.
bindsym --to-code Mod1+Tab       focus next
bindsym --to-code Mod1+shift+Tab focus prev

# Scripts
# There is no b1air-settings binary: the settings UI imports Services, which
# needs types that exist only inside the running quickshell process, so a
# separate program could never load it. These open the in-shell panel, the same
# as everything else in this file.
bindsym --to-code $mod+shift+s   exec b1air-shell toggle settings
# The key hints, as it was from the first sway config (keyhints.sh) until it
# was pointed at the About page. About is still in Settings, one click away.
bindsym --to-code $mod+h         exec b1air-shell toggle guide
bindsym --to-code $mod+c         exec b1air-shell toggle control
bindsym --to-code $mod+shift+n   exec b1air-shell toggle notifications
bindsym --to-code $mod+b         exec b1air-shell toggle battery
bindsym --to-code $mod+n         exec b1air-shell toggle network
bindsym --to-code $mod+m         exec b1air-shell toggle monitors
bindsym --to-code $mod+shift+m   exec b1air-shell toggle ruler
bindsym --to-code $mod+shift+t   exec b1air-shell toggle focustime
bindsym --to-code $mod+shift+k   exec b1air-shell toggle keyboard

# ── Layout ────────────────────────────────────────────────────────
bindsym --to-code $mod+ctrl+space floating toggle
# Hyprland's keys: Mod+V floats, Mod+Alt+Space floats (or tiles) the whole
# workspace.
bindsym --to-code $mod+v         floating toggle
bindsym --to-code $mod+Mod1+space exec $b1airBin/b1air-daemon window float-all
bindsym --to-code $mod+shift+f   exec $b1airBin/b1air-daemon fullscreen-toggle
bindsym --to-code $mod+minus     exec $b1airBin/b1air-daemon window minimize
bindsym --to-code $mod+shift+minus exec $b1airBin/b1air-daemon window restore
# Maximize — bar and gaps stay — as Mod+Ctrl+F was under Hyprland
# (`fullscreen, 1`). Fullscreen across every output moved to Mod+Ctrl+Shift+F.
bindsym --to-code $mod+ctrl+f       exec $b1airBin/b1air-daemon window maximize
bindsym --to-code $mod+ctrl+shift+f fullscreen toggle global
# Hyprland's opaque toggle, for a see-through window you need to read.
bindsym --to-code $mod+ctrl+o       exec $b1airBin/b1air-daemon window opacity-toggle

# Tabs, which is what Hyprland's groups become here: Mod+Ctrl+G turns the
# window's container into tabs and back, Mod+Tab steps through them.
# (Mod+G stays GitHub Desktop.) Moving a window into a neighbouring group is
# Mod+Ctrl+arrow, which sway already does when the neighbour is tabbed.
bindsym --to-code $mod+ctrl+g       layout toggle tabbed split
bindsym --to-code $mod+Tab          focus next sibling
bindsym --to-code $mod+shift+Tab    focus prev sibling
bindsym --to-code $mod+shift+g   exec $b1airBin/b1air-daemon game-mode toggle

# Split direction
bindsym --to-code $mod+shift+i   split toggle
bindsym --to-code $mod+j         layout toggle split

# ── Focus (arrow keys) ────────────────────────────────────────────
bindsym --to-code $mod+Left      focus left
bindsym --to-code $mod+Right     focus right
bindsym --to-code $mod+Up        focus up
bindsym --to-code $mod+Down      focus down

# ── Move windows (Ctrl+arrows) ────────────────────────────────────
bindsym --to-code $mod+ctrl+Left  move left
bindsym --to-code $mod+ctrl+Right move right
bindsym --to-code $mod+ctrl+Up    move up
bindsym --to-code $mod+ctrl+Down  move down

# Swap with the neighbour, as $mod+Alt+arrows did under Hyprland (swapwindow).
# It was never carried over to sway, so the keys did nothing. sway has no
# direction-swap command, so: mark this window, step to the neighbour, swap
# the two, then step the same way again — which is where the marked window
# now is — and drop the mark. (Criteria such as [con_mark=…] in the middle of
# a comma list are not applied, so following it by mark does not work.)
bindsym --to-code $mod+Mod1+Left  mark --add _swap, focus left, swap container with mark _swap, focus left, unmark _swap
bindsym --to-code $mod+Mod1+Right mark --add _swap, focus right, swap container with mark _swap, focus right, unmark _swap
bindsym --to-code $mod+Mod1+Up    mark --add _swap, focus up, swap container with mark _swap, focus up, unmark _swap
bindsym --to-code $mod+Mod1+Down  mark --add _swap, focus down, swap container with mark _swap, focus down, unmark _swap

# ── Resize windows (Shift+arrows) ─────────────────────────────────
bindsym --to-code $mod+shift+Left  resize shrink width  50px
bindsym --to-code $mod+shift+Right resize grow   width  50px
bindsym --to-code $mod+shift+Up    resize shrink height 50px
bindsym --to-code $mod+shift+Down  resize grow   height 50px

# ── Workspaces ────────────────────────────────────────────────────
bindsym --to-code $mod+1  workspace number 1
bindsym --to-code $mod+2  workspace number 2
bindsym --to-code $mod+3  workspace number 3
bindsym --to-code $mod+4  workspace number 4
bindsym --to-code $mod+5  workspace number 5
bindsym --to-code $mod+6  workspace number 6
bindsym --to-code $mod+7  workspace number 7
bindsym --to-code $mod+8  workspace number 8
bindsym --to-code $mod+9  workspace number 9
bindsym --to-code $mod+0  workspace number 10

bindsym --to-code $mod+shift+1  move container to workspace number 1
bindsym --to-code $mod+shift+2  move container to workspace number 2
bindsym --to-code $mod+shift+3  move container to workspace number 3
bindsym --to-code $mod+shift+4  move container to workspace number 4
bindsym --to-code $mod+shift+5  move container to workspace number 5
bindsym --to-code $mod+shift+6  move container to workspace number 6
bindsym --to-code $mod+shift+7  move container to workspace number 7
bindsym --to-code $mod+shift+8  move container to workspace number 8
bindsym --to-code $mod+shift+9  move container to workspace number 9
bindsym --to-code $mod+shift+0  move container to workspace number 10

# Scroll through workspaces
# Wheel down = next, as under Hyprland (mouse_down -> e+1). This was the other
# way round, so the wheel moved through workspaces backwards from what the
# hand was used to.
bindsym --to-code --whole-window $mod+button5 workspace next
bindsym --to-code --whole-window $mod+button4 workspace prev

# Scratchpad. Where the compositor has the special workspace (our swayfx), the
# daemon rebinds these two to it, as under Hyprland: Mod+S calls it up over the
# current workspace and puts it away, Mod+Ctrl+Shift+S sends the window there.
bindsym --to-code $mod+s            scratchpad show
bindsym --to-code $mod+ctrl+shift+s move scratchpad

# ── Mouse: move / resize floating ─────────────────────────────────
floating_modifier $mod normal

# ── Screenshots ───────────────────────────────────────────────────
# Print opens the interactive selection/annotate/record overlay
# (b1air-shot); shift+Print
# is the same overlay in edit mode. Full/window stay instant: no need for an
# interactive selector when the target is the whole screen or one window.
bindsym --to-code Print                  exec $b1airBin/b1air-daemon screenshot select
bindsym --to-code shift+Print            exec $b1airBin/b1air-daemon screenshot select --edit
bindsym --to-code $mod+Print             exec $b1airBin/b1air-daemon screenshot full
bindsym --to-code $mod+shift+Print       exec $b1airBin/b1air-daemon screenshot window
# The variants the first sway config had, lost with its screenshot script:
# the focused window on Alt+Print, the whole screen on Mod+Alt+Print, and the
# whole screen after 5 or 10 seconds, for catching a menu that closes on a
# keypress.
bindsym --to-code Mod1+Print             exec $b1airBin/b1air-daemon screenshot window
bindsym --to-code $mod+Mod1+Print        exec $b1airBin/b1air-daemon screenshot full
bindsym --to-code $mod+ctrl+Print        exec $b1airBin/b1air-daemon screenshot full --delay 5
bindsym --to-code $mod+ctrl+shift+Print  exec $b1airBin/b1air-daemon screenshot full --delay 10

# ── Screen lock ───────────────────────────────────────────────────
bindsym --to-code ctrl+alt+l exec $lock

# The lid and the power button do what Settings → Power says (sleep, lock,
# turn the screen off, shut down or nothing; plugged in and on battery each
# their own), handled by the daemon. While these lines are here the daemon
# tells logind to leave both alone; without them logind acts as before.
# --locked: they work on the lock screen too.
bindswitch --reload --locked lid:on exec $b1airBin/b1air-daemon lid close
bindswitch --reload --locked lid:off exec $b1airBin/b1air-daemon lid open
bindsym --locked XF86PowerOff exec $b1airBin/b1air-daemon power-key

# ── Power & Session Menu ──────────────────────────────────────────
bindsym --to-code $mod+shift+e exec b1air-shell toggle session
# Log out, after a confirmation. The sway config started with this on
# Mod+Shift+M ("Exit sway?" through swaynag), and it was dropped when that key
# went to the screen ruler — leaving the session menu as the only way out.
bindsym --to-code $mod+shift+l exec swaynag -t warning -m "Log out of this session?" -B "Log out" "$b1airBin/b1air-daemon power logout" --background 1a1b26 --text c0caf5 --button-background 24283b --button-text c0caf5 --border 7aa2f7 --border-bottom 7aa2f7

# ── Microphone ──
bindsym --to-code --locked XF86AudioMicMute exec $b1airBin/b1air-daemon mic toggle

# ── Screen brightness ─────────────────────────────────────────────
bindsym --locked XF86MonBrightnessUp   exec $b1airBin/b1air-daemon brightness up 5
bindsym --locked XF86MonBrightnessDown exec $b1airBin/b1air-daemon brightness down 5

# ── Keyboard backlight (T2 Mac) ───────────────────────────────────
bindsym --to-code --locked XF86KbdBrightnessUp   exec $b1airBin/b1air-daemon kbd-backlight up
bindsym --to-code --locked XF86KbdBrightnessDown exec $b1airBin/b1air-daemon kbd-backlight down

# ── Volume ────────────────────────────────────────────────────────
bindsym --locked XF86AudioRaiseVolume exec $b1airBin/b1air-daemon volume up
bindsym --locked XF86AudioLowerVolume exec $b1airBin/b1air-daemon volume down
bindsym --locked XF86AudioMute        exec $b1airBin/b1air-daemon volume mute

# ── Media playback ────────────────────────────────────────────────
bindsym --locked XF86AudioPlay  exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioNext  exec playerctl next
bindsym --locked XF86AudioPrev  exec playerctl previous
