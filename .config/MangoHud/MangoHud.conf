# MangoHud, the in-game overlay, as b1air sets it up: one quiet row in the
# corner, the numbers that say whether a game runs well, in the desktop's
# font. Settings → Game Mode switches it on for every game (from the next
# login); Shift+F12 hides and shows it in a game.

horizontal
position=top-left
round_corners=10
background_alpha=0.45
font_size=18
toggle_hud=Shift_R+F12

fps
frametime
frame_timing=0
cpu_stats
cpu_temp
gpu_stats
gpu_temp
ram
vram
gamemode
