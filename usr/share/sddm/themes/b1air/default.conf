; Colours are not set here any more: they come from the desktop's live
; palette (components/ThemeColors.qml, read from what b1air-daemon writes). A value set
; here still wins, so this is the place to pin one colour by hand.

; =============================================================================
; Blair SDDM Theme Configuration (Tokyo Night)
; =============================================================================

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "/var/cache/wallpaper/current.jpg"
use-background-color = false
; background-color = "#1a1b26"
blur = 28
brightness = -0.05
saturation = 0.05

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "JetBrainsMono Nerd Font"
font-size = 72
font-weight = 900
; color = "#c0caf5"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "Inter"
font-size = 15
font-weight = 600
; color = "#7aa2f7"
margin-top = -12

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Press any key to login"
font-family = "Inter"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
; color = "#a9b1d6"
paint-icon = true
spacing = 4

[LoginScreen]
background = "/var/cache/wallpaper/current.jpg"
use-background-color = false
; background-color = "#1a1b26"
blur = 18
brightness = -0.08
saturation = 0.05

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 110
inactive-size = 75
inactive-opacity = 0.40
active-border-size = 2
inactive-border-size = 0
; active-border-color = "#7aa2f7"
; inactive-border-color = "#565f89"

[LoginScreen.LoginArea.Username]
font-family = "Inter"
font-size = 16
font-weight = 700
; color = "#c0caf5"
margin = 12

[LoginScreen.LoginArea.PasswordInput]
width = 220
height = 34
display-icon = true
font-family = "JetBrainsMono Nerd Font"
font-size = 13
icon = "password.svg"
icon-size = 16
; content-color = "#c0caf5"
; background-color = "#16161e"
background-opacity = 0.65
border-size = 1
; border-color = "#7aa2f7"
border-radius-left = 10
border-radius-right = 10
margin-top = 12
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
; background-color = "#7aa2f7"
background-opacity = 0.85
; active-background-color = "#7aa2f7"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
; content-color = "#1a1b26"
; active-content-color = "#1a1b26"
border-size = 0
; border-color = "#7aa2f7"
border-radius-left = 10
border-radius-right = 10
margin-left = 6
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Inter"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Authenticating..."
font-family = "Inter"
font-weight = 600
font-size = 13
icon-size = 28
icon = "spinner.svg"
; color = "#7aa2f7"
spacing = 6

[LoginScreen.LoginArea.WarningMessage]
font-family = "Inter"
font-size = 11
font-weight = 400
; normal-color = "#c0caf5"
; warning-color = "#e0af68"
; error-color = "#f7768e"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 40
margin-right = 40
margin-bottom = 40
margin-left = 40
size = 34
border-radius = 8
spacing = 10
font-family = "Inter"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 32
item-spacing = 2
padding = 6
display-scrollbar = true
margin = 6
; background-color = "#16161e"
background-opacity = 0.85
; active-option-background-color = "#7aa2f7"
active-option-background-opacity = 0.25
; content-color = "#c0caf5"
; active-content-color = "#7aa2f7"
font-family = "Inter"
border-size = 1
; border-color = "#283457"
font-size = 12
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
; background-color = "#16161e"
background-opacity = 0.50
active-background-opacity = 0.80
; content-color = "#c0caf5"
; active-content-color = "#7aa2f7"
border-size = 1
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
; background-color = "#16161e"
background-opacity = 0.50
active-background-opacity = 0.80
; content-color = "#c0caf5"
; active-content-color = "#7aa2f7"
border-size = 1
font-size = 11
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
; background-color = "#16161e"
background-opacity = 0.50
active-background-opacity = 0.80
; content-color = "#c0caf5"
; active-content-color = "#7aa2f7"
border-size = 1
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 110
; background-color = "#16161e"
background-opacity = 0.50
active-background-opacity = 0.80
; content-color = "#c0caf5"
; active-content-color = "#f7768e"
border-size = 1
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
; background-color = "#16161e"
background-opacity = 0.85
; key-content-color = "#c0caf5"
; key-color = "#24283b"
key-opacity = 0.70
; key-active-background-color = "#7aa2f7"
key-active-opacity = 0.90
; selection-background-color = "#283457"
; selection-content-color = "#c0caf5"
; primary-color = "#7aa2f7"
border-size = 1
; border-color = "#283457"

[Tooltips]
enable = true
font-family = "Inter"
font-size = 11
; content-color = "#c0caf5"
; background-color = "#16161e"
background-opacity = 0.85
border-radius = 6
disable-user = false
disable-login-button = false
