; Colours are not set here any more: they come from the desktop's live
; palette (components/ThemeColors.qml, read from what b1air-daemon writes). A value set
; here still wins, so this is the place to pin one colour by hand.

; =============================================================================
; Blair SDDM Theme Configuration
; =============================================================================

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 270
padding-right = 0
padding-bottom = 56
padding-left = 0
background = "/var/cache/wallpaper/current.jpg"
use-background-color = false
; background-color = "#1a1b26"
blur = 28
brightness = -0.05
saturation = 0.05

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "HH:mm"
; The desktop's sans, as its lock screen draws the time: the terminal's
; monospace here was the old Tokyo Night look.
font-family = "Inter"
font-size = 150
font-weight = 700
; color = "#c0caf5"

[LockScreen.Date]
display = true
format = "dddd, d MMMM"
font-family = "Inter"
font-size = 24
font-weight = 400
; color = "#7aa2f7"
margin-top = -18

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
font-family = "Inter"
font-size = 16
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 18
; color = "#a9b1d6"
paint-icon = true
spacing = 8

[LoginScreen]
background = "/var/cache/wallpaper/current.jpg"
use-background-color = false
; background-color = "#1a1b26"
blur = 18
brightness = -0.08
saturation = 0.05

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 92
inactive-size = 64
inactive-opacity = 0.40
active-border-size = 3
inactive-border-size = 0
; active-border-color = "#7aa2f7"
; inactive-border-color = "#565f89"

[LoginScreen.LoginArea.Username]
font-family = "Inter"
font-size = 26
font-weight = 700
; color = "#c0caf5"
margin = 16

[LoginScreen.LoginArea.PasswordInput]
width = 380
height = 56
display-icon = true
font-family = "Inter"
font-size = 18
icon = "password.svg"
icon-size = 20
; content-color = "#c0caf5"
; background-color = "#16161e"
background-opacity = 0.70
border-size = 2
; border-color = "#7aa2f7"
border-radius-left = 28
border-radius-right = 28
margin-top = 16
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
; background-color = "#7aa2f7"
background-opacity = 0.85
; active-background-color = "#7aa2f7"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 22
; content-color = "#1a1b26"
; active-content-color = "#1a1b26"
border-size = 0
; border-color = "#7aa2f7"
border-radius-left = 28
border-radius-right = 28
margin-left = 10
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Inter"
font-size = 15
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
font-family = "Inter"
font-weight = 600
font-size = 16
icon-size = 28
icon = "spinner.svg"
; color = "#7aa2f7"
spacing = 6

[LoginScreen.LoginArea.WarningMessage]
font-family = "Inter"
font-size = 16
font-weight = 400
; normal-color = "#c0caf5"
; warning-color = "#e0af68"
; error-color = "#f7768e"
margin-top = 16

[LoginScreen.MenuArea.Buttons]
margin-top = 28
margin-right = 28
margin-bottom = 28
margin-left = 28
size = 52
border-radius = 26
spacing = 12
font-family = "Inter"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 40
item-spacing = 2
padding = 6
display-scrollbar = true
margin = 6
; background-color = "#16161e"
background-opacity = 0.85
; active-option-background-color = "#7aa2f7"
active-option-background-opacity = 0.25
; content-color = "#c0caf5"
; active-content-color = "#7aa2f7"
font-family = "Inter"
border-size = 1
; border-color = "#283457"
font-size = 15
icon-size = 18

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 220
popup-width = 200
; background-color = "#16161e"
background-opacity = 0.55
active-background-opacity = 0.80
; content-color = "#c0caf5"
; active-content-color = "#7aa2f7"
border-size = 1
font-size = 15
icon-size = 20

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
; background-color = "#16161e"
background-opacity = 0.55
active-background-opacity = 0.80
; content-color = "#c0caf5"
; active-content-color = "#7aa2f7"
border-size = 1
font-size = 15
icon = "language.svg"
icon-size = 20

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
; background-color = "#16161e"
background-opacity = 0.55
active-background-opacity = 0.80
; content-color = "#c0caf5"
; active-content-color = "#7aa2f7"
border-size = 1
icon = "keyboard.svg"
icon-size = 20

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 110
; background-color = "#16161e"
background-opacity = 0.55
active-background-opacity = 0.80
; content-color = "#c0caf5"
; active-content-color = "#f7768e"
border-size = 1
icon = "power.svg"
icon-size = 20

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
; background-color = "#16161e"
background-opacity = 0.85
; key-content-color = "#c0caf5"
; key-color = "#24283b"
key-opacity = 0.70
; key-active-background-color = "#7aa2f7"
key-active-opacity = 0.90
; selection-background-color = "#283457"
; selection-content-color = "#c0caf5"
; primary-color = "#7aa2f7"
border-size = 1
; border-color = "#283457"

[Tooltips]
enable = true
font-family = "Inter"
font-size = 14
; content-color = "#c0caf5"
; background-color = "#16161e"
background-opacity = 0.85
border-radius = 14
disable-user = false
disable-login-button = false
