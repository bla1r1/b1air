# Builds the suite and runs the smoke tests on every push and pull request.
#
# In an Ubuntu 26.04 container: the suite needs Qt 6.6 or newer (install.sh
# checks for it), and the runner's own Ubuntu 24.04 has Qt 6.4. 26.04 is also
# what the suite is tested on by hand.
#
# tools/smoke.sh is what a contributor runs before committing; the shell-boot
# check needs a Wayland session and skips itself here.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential cmake ninja-build pkgconf python3 \
            libssl-dev libsystemd-dev libpolkit-agent-1-dev libarchive-dev \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-wayland-dev qt6-multimedia-dev qt6-svg-dev liblayershellqtinterface-dev \
            libwayland-dev libwayland-bin wayland-protocols libcairo2-dev libxkbcommon-dev libpam0g-dev

      - uses: actions/checkout@v5

      - name: Build
        run: make -C src suite -j"$(nproc)"

      - name: Smoke tests
        # HOME is root's in the container; the daemon's read-only verbs
        # create their state under it, which is part of what is tested.
        run: make -C src smoke

      - name: Fingerprint, against fprintd's virtual reader
        # A system bus, polkitd and fprintd of its own in the container, the
        # libfprint virtual device standing in for a reader.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends fprintd libpam-fprintd dbus-daemon polkitd python3
          tools/test-fingerprint.sh src/build/bin/b1air-daemon

  # Every name in the package lists is in that family's repositories, asked
  # of its own package manager (and the AUR's API for Arch): a renamed or
  # dropped package stops install.sh half way on a new machine.
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: debian
            image: ubuntu:26.04
            prepare: apt-get update
          - family: fedora
            image: fedora:latest
            prepare: dnf -q makecache
          - family: arch
            image: archlinux:latest
            prepare: pacman -Sy --noconfirm && pacman -S --noconfirm --needed curl
          - family: opensuse
            image: opensuse/tumbleweed
            prepare: zypper -n refresh
    name: packages (${{ matrix.family }})
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Repositories
        run: ${{ matrix.prepare }}
      - name: Every listed package exists
        run: tools/check-packages.sh ${{ matrix.family }}

  # swayfx with our patch series, built the way install.sh builds it, on
  # every family install.sh supports, then started headless on the software
  # renderer (no GPU on the runner — which is itself what scenefx patch 0001
  # is for) and checked over IPC. A patch that stops applying after a version
  # bump, a build dependency list that names a missing package, or a patch
  # that stops doing what it says fails here instead of on someone's machine.
  swayfx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: debian
            image: ubuntu:26.04
            install: apt-get install -y --no-install-recommends
            refresh: apt-get update
            extras: ca-certificates python3 foot fonts-dejavu-core util-linux passwd
          - family: fedora
            image: fedora:latest
            install: dnf install -y
            refresh: "true"
            extras: python3 foot dejavu-sans-mono-fonts util-linux shadow-utils
          - family: arch
            image: archlinux:latest
            install: pacman -S --noconfirm --needed
            refresh: pacman -Syu --noconfirm
            extras: python foot ttf-dejavu util-linux shadow
          - family: opensuse
            image: opensuse/tumbleweed
            install: zypper -n install
            refresh: zypper -n refresh
            extras: python3 foot dejavu-fonts util-linux shadow tar gzip
    name: swayfx (${{ matrix.family }})
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ${{ matrix.refresh }}
          ${{ matrix.install }} git ${{ matrix.extras }}

      - uses: actions/checkout@v5

      - name: Build dependencies of swayfx
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          . lib/distro.sh
          list=packages/swayfx-build/${{ matrix.family }}.txt
          ${{ matrix.install }} $(read_package_list "$list" required)
          for pkg in $(read_package_list "$list" optional); do
            ${{ matrix.install }} "$pkg" || echo "optional $pkg: not available"
          done

      - name: Build swayfx
        run: B1AIR_SWAYFX_VERBOSE=1 B1AIR_SWAYFX_SRC="$RUNNER_TEMP/swayfx-src" tools/build-swayfx.sh

      - name: Test swayfx
        # As an ordinary user, as it runs in a session.
        run: |
          useradd -m tester
          runuser -u tester -- tools/test-swayfx.sh /usr/local/bin/swayfx

  # A first install, as on a new machine: a new account, install.sh from
  # start to end with its packages, then the session started the way the
  # login screen starts it and its shortcuts pressed. A clean install once
  # stopped half way (on a missing ~/.local/share/icons) and left every
  # shortcut pointing at programs that were never built; nothing above
  # would have seen it, since they all start from a prepared machine.
  clean-install:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: A bare system with a user who can sudo
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git ca-certificates python3 rsync
          useradd -m -s /bin/bash tester
          echo 'tester:b1airtest' | chpasswd     # for the lock screen check
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester

      - uses: actions/checkout@v5

      - name: install.sh
        # No services: there is no systemd to enable them with in a container.
        run: |
          cp -a "$GITHUB_WORKSPACE" /home/tester/DotsFiles
          chown -R tester /home/tester/DotsFiles
          runuser -u tester -- env DEBIAN_FRONTEND=noninteractive \
            bash -c 'cd ~/DotsFiles && ./install.sh --skip-services </dev/null'

      - name: Everything the config starts is installed
        run: runuser -u tester -- bash -c '~/DotsFiles/tools/check-install.sh'

      - name: The session starts and answers its shortcuts
        run: runuser -u tester -- env B1AIR_TEST_PASSWORD=b1airtest bash -c '~/DotsFiles/tools/test-session.sh'

      - name: A second account gets the desktop at its first login
        # Nothing of the installer's in its home: b1air-session copies the
        # defaults from /usr/share/b1air/skel (install_system_defaults).
        run: |
          useradd -m -s /bin/bash second
          runuser -u tester -- bash -c 'cd ~/DotsFiles && ./install.sh --add-user second'
          # The tests, where the second account can read them.
          cp -a /home/tester/DotsFiles/tools /tmp/b1air-tools && chmod -R a+rX /tmp/b1air-tools
          runuser -u second -- bash -c '/tmp/b1air-tools/test-session.sh'
